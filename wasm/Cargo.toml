[package]
name = "tacit-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
compile = { path = "../crates/compile" }
uir = { path = "../crates/uir" }

[profile.release]
opt-level = 3
panic = "abort"
lto = true

# Keep this crate out of the root workspace (it's a standalone WASM build).
[workspace]
